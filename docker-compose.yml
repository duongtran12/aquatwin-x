services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      AQUATWIN_RUNTIME_MODE: real
      AQUATWIN_VERSION: ${AQUATWIN_VERSION:-0.1.0}
      AQUATWIN_BUILD_COMMIT: ${AQUATWIN_BUILD_COMMIT:-local}
      AQUATWIN_CORS_ORIGINS: ${AQUATWIN_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
