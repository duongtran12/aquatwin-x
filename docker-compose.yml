services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      AQUATWIN_RUNTIME_MODE: real
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
