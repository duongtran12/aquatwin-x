name: AquaTwin-X Full Benchmark

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/benchmark.yml
      - experiments/configs/week8_demo.json
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark matrix to execute
        required: true
        default: demo
        type: choice
        options:
          - demo
          - extended

permissions:
  contents: read

concurrency:
  group: aquatwin-benchmark-${{ inputs.profile || 'demo' }}
  cancel-in-progress: false

jobs:
  real-benchmark:
    name: Real WNTR ${{ inputs.profile || 'demo' }} benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AQUATWIN_RUNTIME_MODE: real
      BENCHMARK_PROFILE: ${{ inputs.profile || 'demo' }}
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Select benchmark profile
        id: profile
        shell: bash
        run: |
          if [ "$BENCHMARK_PROFILE" = "extended" ]; then
            echo "config=experiments/configs/benchmark_12node.json" >> "$GITHUB_OUTPUT"
            echo "output=data/benchmark/benchmark_12node" >> "$GITHUB_OUTPUT"
          else
            echo "config=experiments/configs/week8_demo.json" >> "$GITHUB_OUTPUT"
            echo "output=data/benchmark/week8_demo" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify real runtime
        run: |
          python - <<'PY'
          from backend.app.services.aquatwin_service import AquaTwinService

          runtime = AquaTwinService("real").runtime_status()
          print(runtime)
          assert runtime["effective_mode"] == "real"
          assert runtime["wntr_available"] is True
          assert runtime["synthetic_data"] is False
          PY

      - name: Run benchmark
        run: |
          python -m experiments.cli \
            --config "${{ steps.profile.outputs.config }}" \
            --output-dir "${{ steps.profile.outputs.output }}"

      - name: Validate evidence files
        env:
          OUTPUT_DIR: ${{ steps.profile.outputs.output }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_DIR"])
          result = json.loads((root / "benchmark_results.json").read_text(encoding="utf-8"))
          assert result["configuration"]["scenario_count"] > 0
          assert result["evaluation"]["overall"]["ga_run_count"] > 0
          assert result["summary"]["exhaustive_search"]["run_count"] > 0
          for filename in (
              "benchmark_results.json",
              "benchmark_runs.csv",
              "benchmark_summary.csv",
              "benchmark_report.md",
          ):
              path = root / filename
              assert path.is_file() and path.stat().st_size > 0
          overall = result["evaluation"]["overall"]
          print(json.dumps(overall, indent=2))

          def number(value, digits=3):
              return "-" if value is None else f"{float(value):.{digits}f}"

          def percent(value):
              return "-" if value is None else f"{float(value) * 100:.1f}%"

          lines = [
              "# AquaTwin-X Real WNTR Benchmark",
              "",
              f"- Profile: `{os.environ['BENCHMARK_PROFILE']}`",
              f"- Scenarios: **{result['configuration']['scenario_count']}**",
              f"- GA runs evaluated: **{overall['ga_run_count']}**",
              "",
              "| Metric | Result |",
              "| --- | ---: |",
              f"| Global optimum hit rate | {percent(overall.get('global_optimum_hit_rate'))} |",
              f"| Mean score gap | {number(overall.get('mean_score_gap'))} |",
              f"| Maximum score gap | {number(overall.get('maximum_score_gap'))} |",
              f"| Within-one-point rate | {percent(overall.get('within_one_point_rate'))} |",
              f"| Mean speedup | {number(overall.get('mean_speedup'), 2)}x |",
              f"| Mean candidate reduction | {percent(overall.get('mean_candidate_reduction_rate'))} |",
              "",
              "The downloadable artifact contains JSON, raw CSV, summary CSV, and Markdown evidence.",
              "",
          ]
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines))
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: aquatwin-${{ inputs.profile || 'demo' }}-benchmark-${{ github.sha }}
          path: ${{ steps.profile.outputs.output }}/*
          if-no-files-found: error
          retention-days: 90
