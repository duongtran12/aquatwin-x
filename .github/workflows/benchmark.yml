name: AquaTwin-X Full Benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark matrix to execute
        required: true
        default: demo
        type: choice
        options:
          - demo
          - extended

permissions:
  contents: read

concurrency:
  group: aquatwin-benchmark-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  real-benchmark:
    name: Real WNTR ${{ inputs.profile }} benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AQUATWIN_RUNTIME_MODE: real
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Select benchmark profile
        id: profile
        shell: bash
        run: |
          if [ "${{ inputs.profile }}" = "extended" ]; then
            echo "config=experiments/configs/benchmark_12node.json" >> "$GITHUB_OUTPUT"
            echo "output=data/benchmark/benchmark_12node" >> "$GITHUB_OUTPUT"
          else
            echo "config=experiments/configs/week8_demo.json" >> "$GITHUB_OUTPUT"
            echo "output=data/benchmark/week8_demo" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify real runtime
        run: |
          python - <<'PY'
          from backend.app.services.aquatwin_service import AquaTwinService

          runtime = AquaTwinService("real").runtime_status()
          print(runtime)
          assert runtime["effective_mode"] == "real"
          assert runtime["wntr_available"] is True
          assert runtime["synthetic_data"] is False
          PY

      - name: Run benchmark
        run: |
          python -m experiments.cli \
            --config "${{ steps.profile.outputs.config }}" \
            --output-dir "${{ steps.profile.outputs.output }}"

      - name: Validate evidence files
        env:
          OUTPUT_DIR: ${{ steps.profile.outputs.output }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_DIR"])
          result = json.loads((root / "benchmark_results.json").read_text(encoding="utf-8"))
          assert result["configuration"]["scenario_count"] > 0
          assert result["evaluation"]["overall"]["ga_run_count"] > 0
          assert result["summary"]["exhaustive_search"]["run_count"] > 0
          for filename in (
              "benchmark_results.json",
              "benchmark_runs.csv",
              "benchmark_summary.csv",
              "benchmark_report.md",
          ):
              path = root / filename
              assert path.is_file() and path.stat().st_size > 0
          print(json.dumps(result["evaluation"]["overall"], indent=2))
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: aquatwin-${{ inputs.profile }}-benchmark-${{ github.sha }}
          path: ${{ steps.profile.outputs.output }}/*
          if-no-files-found: error
          retention-days: 90
