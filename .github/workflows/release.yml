name: AquaTwin-X Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-bundle:
    name: Verify and package ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AQUATWIN_RUNTIME_MODE: real
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend
          npm ci

      - name: Verify release metadata
        run: python scripts/check_release.py --tag "${{ github.ref_name }}"

      - name: Run backend tests
        run: python -m pytest -q

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm test
          npm run build

      - name: Assemble release directory
        run: |
          mkdir release
          git archive --format=tar HEAD | tar -xf - -C release
          cp -R frontend/dist release/frontend/dist

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: aquatwin-x-${{ github.ref_name }}
          path: release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
